name = "storytrackr-worker"
main = "src/worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "ASM_KV"
id = "fa0dcdbcbfac4c11a7c0ecc9944684f8"
preview_id = "fa0dcdbcbfac4c11a7c0ecc9944684f8"

[[r2_buckets]]
binding = "ASM_R2"
bucket_name = "asm-photos"

# Required secrets (set via Cloudflare Dashboard → Workers → storytrackr-worker → Settings → Variables):
#   ADMIN_EMAIL          - Initial admin email address
#   SESSION_SECRET       - Random 32+ char string for session signing
#   DEMO_TENANT_ID       - UUID for the demo tenant (e.g. "demo-tenant-001")
#   MAILCHANNELS_FROM    - Sending email address (e.g. noreply@storytrackr.app)
#
# Optional secrets (Google integration removed — set only if migrating old data):
#   SITE_PASSWORD        - Legacy passcode fallback

# Worker Routes (configure in Cloudflare Dashboard → Workers → Routes):
#   app.storytrackr.app/api/*  → storytrackr-worker
#
# After adding a Custom Domain to the Worker:
#   storytrackr.app → marketing Pages project (separate)
#   app.storytrackr.app → app Pages project + above Worker Route for /api/*
