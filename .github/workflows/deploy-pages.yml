name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - app/**
      - marketing/**
      - .github/workflows/deploy-pages.yml

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      marketing: ${{ steps.filter.outputs.marketing }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
            marketing:
              - 'marketing/**'

  deploy-app:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          # Deploys app/ → app.storytrackr.app
          command: pages deploy app --project-name=storytrackr-app --branch=${{ github.ref_name }}

  deploy-marketing:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.marketing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          # Deploys marketing/ → storytrackr.app
          command: pages deploy marketing --project-name=storytrackr-marketing --branch=${{ github.ref_name }}
